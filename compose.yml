services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - ezrepo-postgres:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  migrate:
    image: ghcr.io/tobiaswaelde/ezrepo-api:${EZREPO_VERSION:-latest}
    restart: 'no'
    env_file: .env
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy', '--config', 'prisma.config.ts']
    environment: &api-environment
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?schema=public
      SHADOW_DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}_shadow?schema=public
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-http://localhost:3001/api/v1/auth/oidc/callback}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/tobiaswaelde/ezrepo-api:${EZREPO_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '${EZREPO_API_PORT:-3001}:3001'

  web:
    image: ghcr.io/tobiaswaelde/ezrepo-web:${EZREPO_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${EZREPO_WEB_PORT:-3000}:3000'

volumes:
  ezrepo-postgres:
